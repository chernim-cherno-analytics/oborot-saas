# Проверка каждого изменения до того, как оно попадёт на прод.
#
# Раньше единственной проверкой был ручной прогон тестов у того, кто правил код,
# и никакой гарантии, что он вообще был. Прод при этом обновляется автоматически
# из main — то есть непроверенное изменение доезжает до клиента само.
#
# Шаги: зафиксированные зависимости прода → тестовый overlay с браузером →
# ВСЕ наборы тестов в режиме --require-all → smoke старта → smoke миграций.
#
# ПОЧЕМУ --require-all (D-42, 24.08.2026). До этой правки набор, не выполнивший
# ни одной проверки, считался пройденным: test_ui.py возвращал 0, не найдя
# playwright, test_backup.py и test_deploy.py печатали «ИТОГО: 0 OK, 0 FAIL»
# при отсутствии sqlite3 и flock. В прогоне 32716761631 ui показал 0/0 при
# зелёном итоге. Теперь пропуск в CI считается падением, и ключей --allow-skip
# здесь НЕТ НИ ОДНОГО: ui, backup и deploy обязаны отработать и дать ok > 0.
# Заводить исключение можно только вместе с записью в TECH_DEBT.md — иначе
# исключение переживёт причину, по которой его завели.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Очередь на уровне workflow, а не job: пуш в ту же ветку отменяет собственный
# устаревший прогон и освобождает раннер вместо того, чтобы держать два набора
# на одном и том же коде. Группа — workflow + ref, поэтому ветки друг друга не
# отменяют, а main и PR считаются разными очередями. Обязательная проверка при
# этом остаётся ровно одна и называется `tests`: job ниже — единственная, и
# отменённый прогон не может выглядеть зелёным.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей (fail-closed)
        # Тот же lock-файл, что ставит деплой: иначе «зелёный CI» и «то, что
        # поехало в бой» — разные наборы версий, и смысл фиксации теряется.
        #
        # FAIL-CLOSED: раньше при отсутствии lock-файла CI тихо откатывался на
        # requirements.txt с диапазонами и оставался ЗЕЛЁНЫМ. То есть ровно в
        # том случае, ради которого фиксация и заводилась — файл потеряли, не
        # обновили, не залили — проверка молчала. Теперь это падение.
        run: |
          python -m pip install --upgrade pip
          if [ ! -f requirements.lock ]; then
            echo "НЕТ requirements.lock — сборка невоспроизводима, останавливаюсь."
            echo "Соберите lock из проверенного окружения и залейте вместе с кодом."
            exit 1
          fi
          pip install -r requirements.lock

      - name: Зависимости совместимы и совпадают с lock (строгий набор)
        # ЭТОТ ШАГ ЗАМЕНЯЕТ прежний встроенный скрипт `pip check` + сверка
        # версий с lock, и замена не молчаливая: набор `tests/test_dependencies.py`
        # делает всё, что делал скрипт (`pip check`, точное совпадение каждого
        # пина lock с установленной версией), и сверх того — разбор lock на
        # дубли, полноту замыкания и согласие границ `requirements.txt` с
        # `requirements.lock`. Смысл шага строго шире прежнего, ничего из
        # проверявшегося не потеряно.
        #
        # Почему набором, а не строкой здесь: строка внутри workflow локально не
        # запускается и до пуша не падает. Именно так 23.08 в requirements.txt
        # прожили starlette 1.6.0 и pydantic 2.13.4 — версии, которых не было ни
        # в lock, ни на сервере. Идея вынести проверку отдельным набором взята
        # из ветки codex/p20-integration-publish, реализация своя.
        #
        # Шаг стоит ДО тестового overlay намеренно: он сверяет прод-замыкание,
        # и мерить его надо до того, как поверх ляжет playwright.
        #
        # OBOROT_ENFORCE_LOCK=1: в CI расхождение окружения с lock — падение,
        # а не предупреждение. Локально у разработчика может стоять другое.
        #
        # Тот же набор ещё раз проходит внутри run_all.py как обязательный
        # `deps` — здесь он нужен раньше, чтобы не тратить сборку браузера на
        # заведомо неверном окружении.
        run: python tests/test_dependencies.py
        env:
          OBOROT_ENFORCE_LOCK: "1"

      - name: Кэш браузеров playwright
        # Ключ — по dev-lock: обновили playwright, поменялась и сборка браузера,
        # значит кэш обязан протухнуть. Кэшируется каталог, а не факт установки:
        # шаг ниже всё равно выполняется и молча доскачивает недостающее.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements-dev.lock') }}

      - name: Тестовый overlay и браузер (fail-closed)
        # Тот же fail-closed, что и у прод-lock: нет файла — останавливаемся.
        # Молчаливый откат на «поставим playwright как получится» уже однажды
        # дал зелёный CI на наборе, который не открыл ни одной страницы.
        run: |
          if [ ! -f requirements-dev.lock ]; then
            echo "НЕТ requirements-dev.lock — набор ui нечем проверять, останавливаюсь."
            exit 1
          fi
          pip install -r requirements-dev.lock
          pip check
          python -m playwright install --with-deps chromium

      - name: Браузер привязан к playwright, а не к системе
        # Доказательство версии: печатаем то, чем реально будет ходить ui.
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b = pw.chromium.launch()
              print(f"playwright {version('playwright')} · chromium {b.version}")
              b.close()
          PY

      - name: Все наборы тестов (обязательны все, пропуск = падение)
        # По три набора одновременно: на двухъядерном раннере одиннадцать
        # параллельных приложений мешают друг другу и дают ложные падения.
        #
        # --require-all и НИ ОДНОГО --allow-skip: см. шапку файла.
        run: python tests/run_all.py --jobs 3 --require-all
        env:
          OBOROT_COMMIT: ${{ github.sha }}

      - name: Smoke — приложение стартует на чистой базе
        run: |
          python - <<'PY'
          import os
          os.environ["DATABASE_URL"] = "sqlite:///ci_smoke.db"
          os.environ["SCHEDULER_ENABLED"] = "0"
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as c:
              live = c.get("/health/live")
              ready = c.get("/health/ready")
              assert live.status_code == 200, live.text
              assert ready.status_code == 200, ready.text
              body = ready.json()
              assert body.get("startup") and body.get("db"), body
              assert c.get("/login").status_code == 200
              print("smoke старта:", body)
          PY

      - name: Smoke — миграции на базе прежней схемы
        # Проверяем не «создаётся ли схема с нуля» (это делает шаг выше), а то,
        # что приложение поднимается на базе, где новых колонок ещё нет.
        run: |
          python - <<'PY'
          import os, sqlite3
          db = "ci_old.db"
          con = sqlite3.connect(db)
          con.executescript("""
            CREATE TABLE orgs (id INTEGER PRIMARY KEY, name VARCHAR(255) NOT NULL,
                               plan VARCHAR(32) NOT NULL DEFAULT 'trial',
                               settings_json TEXT NOT NULL DEFAULT '{}');
            CREATE TABLE productions (id INTEGER PRIMARY KEY, org_id INTEGER NOT NULL,
                               name VARCHAR(120) NOT NULL,
                               is_main BOOLEAN NOT NULL DEFAULT 0);
            INSERT INTO orgs (name) VALUES ('Старый бренд');
            INSERT INTO productions (org_id, name, is_main) VALUES (1, 'Старый цех', 1);
          """)
          con.commit(); con.close()
          os.environ["DATABASE_URL"] = f"sqlite:///{db}"
          os.environ["SCHEDULER_ENABLED"] = "0"
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as c:
              assert c.get("/health/ready").status_code == 200
          con = sqlite3.connect(db)
          cols = {r[1] for r in con.execute("PRAGMA table_info(productions)")}
          con.close()
          missing = {"lead_time_days", "moq", "pack_multiple", "stages_json"} - cols
          assert not missing, f"миграции не добавили колонки: {missing}"
          print("smoke миграций: колонки на месте, приложение поднялось")
          PY
