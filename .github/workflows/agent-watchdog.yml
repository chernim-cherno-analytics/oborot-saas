name: Agent loop - watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: oborot-agent-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Restart lost or stale handoffs
        uses: actions/github-script@v7
        with:
          script: |
            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const agentPrs = prs.filter(pr =>
              !pr.draft &&
              pr.head.repo?.full_name === repoFullName &&
              pr.head.ref.startsWith('claude/')
            );
            const markerPattern = /<!-- oborot-agent:v1 role=(codex|claude|system) status=([A-Z_]+) head=([0-9a-f]{40}) -->/;
            const now = Date.now();

            for (const pr of agentPrs) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const states = comments.flatMap(comment => {
                const match = comment.body?.match(markerPattern);
                return match ? [{
                  role: match[1],
                  status: match[2],
                  head: match[3],
                  createdAt: new Date(comment.created_at).getTime(),
                }] : [];
              });
              if (states.length === 0) continue;

              const latest = states[states.length - 1];
              const ageMinutes = (now - latest.createdAt) / 60000;
              const currentHead = pr.head.sha;
              if (latest.status === 'APPROVE' || latest.status === 'BLOCKED' ||
                  latest.status === 'NEEDS_HUMAN') {
                continue;
              }

              let workflow;
              let inputs;
              let reason;

              if (latest.role === 'codex' && latest.status === 'REQUEST_CHANGES' &&
                  latest.head === currentHead && ageMinutes >= 15) {
                workflow = 'agent-claude-fix.yml';
                inputs = { pr_number: String(pr.number), expected_head: currentHead };
                reason = 'handoff to Claude was not acknowledged for 15 minutes';
              } else if (latest.role === 'claude' && latest.status === 'DONE' &&
                         latest.head === currentHead && ageMinutes >= 15) {
                workflow = 'agent-codex-review.yml';
                inputs = { pr_number: String(pr.number), expected_head: currentHead };
                reason = 'new Claude commit was not reviewed for 15 minutes';
              } else if (latest.status === 'WORKING' && ageMinutes >= 70) {
                workflow = latest.role === 'claude'
                  ? 'agent-claude-fix.yml'
                  : 'agent-codex-review.yml';
                inputs = { pr_number: String(pr.number), expected_head: currentHead };
                reason = `${latest.role} remained WORKING for ${Math.floor(ageMinutes)} minutes`;
              } else if (latest.head !== currentHead && ageMinutes >= 15) {
                workflow = 'agent-codex-review.yml';
                inputs = { pr_number: String(pr.number), expected_head: currentHead };
                reason = 'PR HEAD changed without a matching review state';
              }

              if (!workflow) continue;

              const matchingStarts = states.filter(state =>
                state.head === currentHead && state.status === 'WORKING' &&
                state.role === (workflow.includes('claude') ? 'claude' : 'codex')
              ).length;
              const humanMarker = `<!-- oborot-agent:v1 role=system status=NEEDS_HUMAN head=${currentHead} -->`;
              if (matchingStarts >= 3) {
                if (!comments.some(comment => comment.body?.includes(humanMarker))) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: [
                      humanMarker,
                      `Watchdog остановил автоматические повторы: ${workflow} запускался трижды для ${currentHead}.`,
                    ].join('\n\n'),
                  });
                }
                continue;
              }

              core.info(`Dispatching ${workflow} for PR #${pr.number}: ${reason}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow,
                ref: pr.base.ref,
                inputs,
              });
            }
