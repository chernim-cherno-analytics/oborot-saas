# Точные версии ТОЛЬКО того, что нужно тестам сверх прода.
#
# Зачем отдельный файл. `requirements.lock` — это то, что стоит на проде, и
# трогать его ради тестового браузера нельзя: прод не должен тащить playwright.
# Но и обратное неверно — «поставим playwright как получится» уже стоило нам
# зелёного CI на наборе, который не открыл ни одной страницы. Поэтому overlay
# зафиксирован так же точно, как прод.
#
# Здесь НЕТ прод-зависимостей: файл ставится ПОВЕРХ requirements.lock и не
# дублирует его замыкание — два файла с разными пинами одного пакета хуже,
# чем отсутствие пинов, потому что противоречие видно только в бою.
#
# Порядок установки (и в CI, и локально):
#     pip install -r requirements.lock
#     pip install -r requirements-dev.lock
#     pip check
#     python -m playwright install --with-deps chromium
#
# СОБРАНО ИЗ РЕАЛЬНОГО ОКРУЖЕНИЯ, а не выписано из головы: чистый venv на
# Python 3.12.13, в него установлен requirements.lock (32 пакета, `pip check`
# чист), затем `pip install playwright`; разница `pip freeze` до и после —
# ровно две строки ниже. После установки `pip check` снова чист.
#
# Транзитивная зависимость playwright `greenlet` НЕ пинуется здесь намеренно:
# она уже есть в requirements.lock (greenlet==3.4.0, туда её приводит
# SQLAlchemy), и playwright 1.62.0 этой версией доволен — иначе `pip check`
# сказал бы об этом. Второй пин той же библиотеки в другом файле — это
# заготовленный конфликт.
#
# БРАУЗЕР. Версия Chromium привязана к версии playwright, а не к системе:
# playwright 1.62.0 ставит сборку chromium-1234, и это Chromium 151.0.7922.34
# (проверено запуском: `pw.chromium.launch().version`). Обновляя playwright,
# заново прогоняйте tests/test_ui.py — браузер уедет вместе с ним.
#
# Каталог браузеров не задаётся ничем: раньше в tests/test_ui.py был зашит
# PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers — путь с машины, которой нет ни у
# CI, ни на macOS. Штатный кэш playwright работает и там, и там.

playwright==1.62.0
