{# ── Общая мобильная вёрстка для самостоятельных страниц ──────────────────────
   Девять «продуктовых» страниц (Оборачиваемость, Активный сток, Мастер заказа,
   Заказ, Заказ позиции, Бюджет, Прогноз, Оборот, Обучение) не наследуют
   base.html: у каждой свой <style> с одинаковой копией каркаса (.header/.nav/
   .main). Медиазапросов там не было вовсе, и на телефоне страница раздувалась
   до 470–590 CSS-пикселей — браузер отдалял всё содержимое, чтобы поместить
   самую широкую строку.

   Замер 22.08.2026 (Chromium, 390×844, эмуляция телефона) показал ровно три
   причины, а не «таблицы», как считалось:
     1. Полосы KPI-карточек — жёсткие сетки repeat(4|5, 1fr): .summary (Активный
        сток), .sumbar (Заказ), .cards (Мастер, Бюджет, Прогноз, Оборот).
        Четыре карточки по 1fr на 390 px дают 97 px на карточку и всё равно
        не помещаются из-за отступов.
     2. Шапка: логотип и десять ссылок в flex с фиксированной высотой 56 px —
        ссылки переносились в 3–4 строки и наезжали на содержимое.
     3. Мелкие таблицы, лежащие прямо в .panel без своей прокрутки
        (Прогноз, Оборот). Большие таблицы уже скроллятся внутри .table-outer
        и странице не мешают — их не трогаем.

   Файл подключается ОДНОЙ строкой в <head> каждой из девяти страниц, поэтому
   правка мобильной вёрстки — это правка одного места, а не девяти копий.
   Всё внутри @media (max-width: 760px) — на десктопе не меняется ничего.
   760 px выбран не случайно: ровно такой брейкпоинт уже используется в
   static/app.css для страниц на общем каркасе, и разъезжаться им незачем. #}
<style>
@media (max-width: 760px) {
  /* ── 1. Шапка: логотип строкой, меню — лента с горизонтальной прокруткой ── */
  .header {
    height: auto; min-height: 52px; padding: 8px 14px;
    flex-wrap: wrap; row-gap: 6px; align-items: center;
  }
  .header .logo { flex: 0 0 auto; }
  .nav {
    flex-wrap: nowrap; width: 100%; gap: 16px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; padding-bottom: 2px;
  }
  .nav::-webkit-scrollbar { height: 0; }
  .nav a { white-space: nowrap; flex: 0 0 auto; padding: 4px 0; }

  .main { padding-left: 14px; padding-right: 14px; }

  /* ── 2. Полосы карточек: две в ряд вместо четырёх-пяти ── */
  .summary, .sumbar, .cards, #summary-cat {
    grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)) !important;
    gap: 10px !important;
  }
  .sum-card, .scard, .cards .card { padding: 12px 14px; }
  .sum-card .val, .scard .sv, .cards .card .v { font-size: 19px; }

  /* ── 3. Мелкие таблицы внутри панелей получают свою прокрутку ── */
  .panel { overflow-x: auto; }

  /* ── 4. Ряды кнопок, чипов и переключателей переносятся ── */
  .seg, .chips, .actions, .toolbar, .tools, .ptools, .filters, .tabs {
    flex-wrap: wrap;
  }

  /* Поля поиска задавались фиксированной шириной 240–320 px — при рабочих
     ~334 px они занимали всю строку и выталкивали соседей. */
  .search, input[type="search"], .dinp, .binp.sm[type="search"] {
    width: 100% !important; max-width: 100% !important; flex: 1 1 100% !important;
    margin-left: 0 !important;
  }

  /* ── 5. Тач-таргеты: на телефоне мелкие кнопки — это промахи ── */
  .go-btn, .btn, .chip, .seg button, .tab { min-height: 40px; }

  /* ── 6. Сетки, у которых элемент не даёт себя сжать: у grid-элемента
         min-width по умолчанию auto, поэтому «Обучение» распирало до 477 px
         самой длинной карточкой урока, хотя колонка уже была одна. ── */
  .cols > *, .grid > * { min-width: 0; }
  .lesson { flex-wrap: wrap; }

  /* ── 7. Полоса покрытия в «Мастере»: имя позиции занимало 220 px
         фиксированной ширины из ~334 доступных. ── */
  .covrow .nm { width: 40%; }
}
</style>
