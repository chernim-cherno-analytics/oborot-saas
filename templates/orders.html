{% extends "base.html" %}
{% block content %}

<div class="no-print">
  <p class="page-sub">Заказы, созданные из «Что заказать». Выберите заказ, чтобы посмотреть состав и распечатать для производства.</p>
  <div id="orders-filter" style="display:none; gap:6px; flex-wrap:wrap; margin:0 0 10px;"></div>
  <div id="orders-box">
    <div class="loading-stub">Загрузка…</div>
  </div>
</div>

<div id="detail-box" style="margin-top:16px;"></div>

{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  var orders = [];
  var currentId = null;
  var box = document.getElementById("orders-box");
  var prodNames = {};       // production_id -> название канала
  var filterPid = "all";    // "all" | "none" | id канала
  var detail = document.getElementById("detail-box");

  var STATUS = {
    draft: '<span class="badge gray">Черновик</span>',
    sent: '<span class="badge blue">В производстве</span>',
    received: '<span class="badge green">Принят на склад</span>'
  };

  // Заказы разных каналов живут по разным правилам (сроки, этапы, деньги),
  // поэтому в общем списке нужен и ярлык канала, и фильтр по нему.
  function chanName(pid) { return pid ? (prodNames[pid] || ("Канал №" + pid)) : ""; }

  function renderFilter() {
    var f = document.getElementById("orders-filter");
    if (!f) return;
    var used = {};
    orders.forEach(function (o) { used[o.production_id || "none"] = true; });
    var keys = Object.keys(used);
    if (keys.length < 2) { f.style.display = "none"; return; }
    var opts = [["all", "Все заказы"]];
    keys.forEach(function (k) {
      if (k !== "none") opts.push([k, chanName(Number(k))]);
    });
    if (used.none) opts.push(["none", "Без канала"]);
    f.style.display = "flex";
    f.innerHTML = opts.map(function (o) {
      return '<button type="button" class="btn' + (filterPid === o[0] ? " primary" : "") +
        '" data-pid="' + esc(o[0]) + '" style="padding:5px 12px; font-size:13px;">' + esc(o[1]) + "</button>";
    }).join("");
    f.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () {
        filterPid = b.getAttribute("data-pid");
        renderFilter();
        renderList();
      });
    });
  }

  function visibleOrders() {
    if (filterPid === "all") return orders;
    if (filterPid === "none") return orders.filter(function (o) { return !o.production_id; });
    return orders.filter(function (o) { return String(o.production_id || "") === filterPid; });
  }

  function reloadAll() {
    api("/api/productions").then(function (d) {
      (d.productions || []).forEach(function (p) { prodNames[p.id] = p.name; });
    }).catch(function () {}).then(function () { loadOrders(); });
  }

  function loadOrders() {
    api("/api/orders").then(function (d) {
      orders = Array.isArray(d) ? d : (d.orders || d.items || []);
      renderFilter();
      renderList();
      if (currentId && orders.some(function (o) { return o.id === currentId; })) {
        openOrder(currentId);
      } else if (orders.length) {
        openOrder(orders[0].id);
      } else {
        detail.innerHTML = "";
      }
    });
  }

  function setStatus(id, status, confirmText) {
    if (confirmText && !confirm(confirmText)) return;
    api("/api/orders/" + id + "/status", { method: "POST", body: { status: status } })
      .then(function () {
        toast(status === "sent"
          ? "Заказ отправлен в производство — учитывается в «едет к нам»"
          : "Заказ принят на склад");
        reloadAll();
      });
  }

  function removeOrder(id, status, pushed) {
    var msg = status === "sent"
      ? (pushed
        ? "Удалить заказ из «Оборота»? Документ «Заказ поставщику» в МойСклад останется и продолжит учитываться в «едет к нам», пока не будет принят или удалён в МС."
        : "Удалить заказ, который уже в производстве? Его количества будут убраны из «едет к нам».")
      : "Удалить черновик заказа?";
    if (!confirm(msg)) return;
    api("/api/orders/" + id, { method: "DELETE" }).then(function () {
      toast("Заказ удалён");
      currentId = null;
      reloadAll();
    });
  }

  api("/api/orders").then(function (d) {
    orders = Array.isArray(d) ? d : (d.orders || d.items || []);
    renderList();
    if (orders.length) openOrder(orders[0].id);
  }).catch(function () {
    box.innerHTML = emptyState("Не удалось загрузить заказы", "Обновите страницу или попробуйте позже.",
      '<button class="btn" onclick="location.reload()">Обновить</button>');
  });

  function orderStats(o) {
    var items = o.items || [];
    var pos = items.length, qty = 0, cost = 0;
    items.forEach(function (it) {
      qty += it.qty || 0;
      cost += (it.qty || 0) * (it.cost || 0);
    });
    return { pos: pos, qty: qty, cost: cost };
  }

  function renderList() {
    var list = visibleOrders();
    if (!orders.length) {
      box.innerHTML = emptyState(
        "Заказов на производство пока нет",
        "Соберите первый заказ из рекомендаций на экране «Что заказать» — система сама разложит его по размерам.",
        '<a class="btn primary" href="/replenish">Перейти к рекомендациям</a>',
        '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l5 3V9l5 3V4h6v17z"/><line x1="4" y1="21" x2="20" y2="21"/></svg>');
      return;
    }
    if (!list.length) {
      box.innerHTML = '<div class="card"><div class="loading-stub">В этом канале заказов нет.</div></div>';
      return;
    }
    box.innerHTML = '<div class="order-grid">' + list.map(function (o) {
      var s = orderStats(o);
      var statsHtml = o.items
        ? '<div class="o-stats"><div><b>' + fmtInt(s.pos) + '</b> <span>поз.</span></div>' +
          '<div><b>' + fmtInt(s.qty) + '</b> <span>шт</span></div>' +
          '<div><b>' + fmtMoney(s.cost) + '</b> <span>себес</span></div></div>'
        : "";
      return '<div class="order-card' + (o.id === currentId ? " active" : "") + '" data-id="' + esc(o.id) + '">' +
        '<div style="display:flex; align-items:center; gap:8px;"><div class="o-name" style="flex:1;">' + esc(o.name) + "</div>" +
        (STATUS[o.status] || "") + "</div>" +
        '<div class="o-meta">Создан ' + fmtDate(o.created_at) + (o.eta_date ? " · готовность " + fmtDate(o.eta_date) : "") +
          (o.production_id ? " · " + esc(chanName(o.production_id)) : "") + "</div>" +
        statsHtml +
        "</div>";
    }).join("") + "</div>";

    box.querySelectorAll(".order-card").forEach(function (card) {
      card.addEventListener("click", function () {
        openOrder(isNaN(Number(card.getAttribute("data-id"))) ? card.getAttribute("data-id") : Number(card.getAttribute("data-id")));
      });
    });
  }

  function pushToMs(id) {
    if (!confirm("Создать в МойСклад документ «Заказ поставщику» с позициями этого заказа?\n\nПозиции лягут по вариантам-размерам, цена за штуку — себестоимость. Позиции, не найденные в ассортименте МС, будут перечислены отдельно.\n\n«Едет к нам» по этому заказу дальше считается по документу МойСклад: приёмки, привязанные к заказу в МС, будут снимать принятое автоматически.")) return;
    api("/api/orders/" + id + "/push-to-ms", { method: "POST" }).then(function (d) {
      if (d.unmatched && d.unmatched.length) {
        toast("Документ «Заказ поставщику» № " + (d.ms_doc_name || "—") + " создан. Не сопоставлено позиций: " +
          d.unmatched.length + " — " + d.unmatched.slice(0, 5).join(", ") +
          (d.unmatched.length > 5 ? "…" : ""));
      } else {
        toast("Документ «Заказ поставщику» № " + (d.ms_doc_name || "—") + " создан в МойСклад", "success");
      }
      openOrder(id);
    });
  }

  function openOrder(id) {
    currentId = id;
    renderList();
    detail.innerHTML = '<div class="card"><div class="loading-stub">Загрузка заказа…</div></div>';
    Promise.all([
      api("/api/orders/" + id),
      hqFetchJson("/api/orders/" + id + "/ms-doc") // тихо: null, если ручки нет
    ]).then(function (res) {
      renderDetail(res[0], res[1]);
    }).catch(function () {
      detail.innerHTML = "";
    });
  }

  function renderDetail(o, msdoc) {
    var items = o.items || [];
    var s = orderStats(o);
    var rev = 0;

    var rows = items.map(function (it) {
      var sizes = it.sizes || {};
      var szKeys = sortSizeKeys(Object.keys(sizes));
      var szText = szKeys.length
        ? szKeys.map(function (k) { return esc(k) + "&thinsp;×&thinsp;" + fmtInt(sizes[k]); }).join(" · ")
        : "<span class='muted'>без размера</span>";
      var sum = (it.qty || 0) * (it.cost || 0);
      return "<tr>" +
        '<td class="name-cell"><span class="name-main">' + esc(it.base_name) + "</span></td>" +
        "<td>" + szText + "</td>" +
        '<td class="num"><b>' + fmtInt(it.qty) + "</b></td>" +
        '<td class="num">' + fmtMoney(it.cost) + "</td>" +
        '<td class="num">' + fmtMoney(sum) + "</td>" +
        "</tr>";
    }).join("");

    detail.innerHTML =
      '<div class="card">' +
      '<div class="print-header"><div class="ph-brand">{{ org.name }} — заказ на производство</div>' +
      '<div class="ph-meta">' + esc(o.name) + " · создан " + fmtDate(o.created_at) +
      (o.eta_date ? " · ожидаемая готовность " + fmtDate(o.eta_date) : "") + "</div></div>" +
      '<div class="card-head">' +
      "<h2>" + esc(o.name) + "</h2>" +
      (STATUS[o.status] || "") +
      '<span style="font-size:12px; color:var(--text-soft);">создан ' + fmtDate(o.created_at) +
      (o.eta_date ? " · готовность " + fmtDate(o.eta_date) : "") + "</span>" +
      '<div class="spacer"></div>' +
      (o.status === "draft"
        ? '<button class="btn sm primary no-print" type="button" id="btn-send">В производство</button>'
        : "") +
      (o.status === "sent"
        ? '<button class="btn sm primary no-print" type="button" id="btn-receive">Принят на склад</button>'
        : "") +
      (msdoc && msdoc.ms_doc_href
        ? '<a class="btn sm no-print" href="' + esc(msdoc.ms_doc_ui_url || msdoc.ms_doc_href) + '" target="_blank" rel="noopener">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
          " Открыть в МойСклад" + (msdoc.ms_doc_name ? " · № " + esc(msdoc.ms_doc_name) : "") + "</a>"
        : (o.status === "draft" || o.status === "sent"
          ? '<button class="btn sm no-print" type="button" id="btn-push-ms">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>' +
            " Отправить в МойСклад</button>"
          : "")) +
      (o.status !== "received"
        ? '<button class="btn sm no-print" type="button" id="btn-delete">Удалить</button>'
        : "") +
      '<button class="btn sm no-print" type="button" id="btn-print">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>' +
      " Печать</button>" +
      "</div>" +
      (o.status === "draft"
        ? (msdoc && msdoc.ms_doc_href
          ? '<div class="page-sub no-print" style="margin:8px 0 0;">Заказ создан в МойСклад — его количества уже учитываются в «едет к нам» по документу МС. Нажмите «В производство», чтобы отразить статус и здесь.</div>'
          : '<div class="page-sub no-print" style="margin:8px 0 0;">Черновик не учитывается в расчётах. Нажмите «В производство», когда заказ реально отправлен — тогда его количества попадут в «едет к нам» и уменьшат рекомендации.</div>')
        : "") +
      '<div class="tbl-wrap"><table class="tbl">' +
      '<thead><tr><th>Позиция</th><th>Размеры</th><th class="num">Кол-во, шт</th><th class="num">Себес за шт</th><th class="num">Сумма</th></tr></thead>' +
      "<tbody>" + (rows || '<tr><td colspan="5" class="muted">В заказе нет позиций</td></tr>') + "</tbody>" +
      "<tfoot><tr><td>ИТОГО: " + fmtInt(s.pos) + " поз.</td><td></td>" +
      '<td class="num">' + fmtInt(s.qty) + "</td><td></td>" +
      '<td class="num">' + fmtMoney(s.cost) + "</td></tr></tfoot>" +
      "</table></div></div>";

    var btn = document.getElementById("btn-print");
    if (btn) btn.addEventListener("click", function () { window.print(); });
    var pushed = !!(msdoc && msdoc.ms_doc_href);
    var bSend = document.getElementById("btn-send");
    if (bSend) bSend.addEventListener("click", function () {
      setStatus(o.id, "sent", pushed
        ? "Отправить заказ в производство? Заказ уже создан в МойСклад — «едет к нам» считается по документу МС."
        : "Отправить заказ в производство? Его количества попадут в «едет к нам» и уменьшат рекомендации «Что заказать».");
    });
    var bRecv = document.getElementById("btn-receive");
    if (bRecv) bRecv.addEventListener("click", function () {
      setStatus(o.id, "received", pushed
        ? "Отметить заказ принятым на склад? «Едет к нам» уменьшится после приёмки по заказу в МойСклад (подтянет синхронизация)."
        : "Отметить заказ принятым на склад? Количества будут убраны из «едет к нам» (фактические остатки обновит синхронизация).");
    });
    var bDel = document.getElementById("btn-delete");
    if (bDel) bDel.addEventListener("click", function () { removeOrder(o.id, o.status, pushed); });
    var bPush = document.getElementById("btn-push-ms");
    if (bPush) bPush.addEventListener("click", function () { pushToMs(o.id); });
    detail.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
});
</script>
{% endblock %}
