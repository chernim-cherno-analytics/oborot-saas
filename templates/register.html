{% extends "base.html" %}
{% block bodyclass %}auth-page{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-logo">
    <span style="width:34px;height:34px;min-width:34px;border-radius:9px;background:var(--blue);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;">О</span>
    <span class="logo-text">Оборот</span>
  </div>

  <div class="auth-card">
    <h1>Регистрация</h1>
    <p class="auth-sub">14 дней бесплатно, карта не нужна</p>

    {% if error %}
    <div class="form-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register">
      <div class="field">
        <label for="name">Ваше имя</label>
        <input class="input" type="text" id="name" name="name" required autofocus
               autocomplete="name" placeholder="Анна Смирнова" value="{{ name or '' }}">
      </div>
      <div class="field">
        <label for="org_name">Название бренда или компании</label>
        <input class="input" type="text" id="org_name" name="org_name" required
               autocomplete="organization" placeholder="Мой бренд" value="{{ org_name or '' }}">
      </div>
      <div class="field">
        <label for="email">Электронная почта</label>
        <input class="input" type="email" id="email" name="email" required
               autocomplete="email" placeholder="you@brand.ru" value="{{ email or '' }}">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input class="input" type="password" id="password" name="password" required
               autocomplete="new-password" minlength="8" placeholder="Не менее 8 символов">
      </div>
      <label style="display:flex; gap:8px; align-items:flex-start; font-size:12.5px; margin:4px 0 12px; cursor:pointer;">
        <input type="checkbox" required style="margin-top:3px;">
        <span>Регистрируясь, я принимаю <a href="/legal/offer" target="_blank">договор-оферту</a> и даю согласие на обработку персональных данных в соответствии с <a href="/legal/privacy" target="_blank">политикой</a></span>
      </label>
      <button class="btn primary" type="submit" style="width:100%">Создать аккаунт</button>
    </form>

    <div class="auth-alt">Уже есть аккаунт? <a href="/login">Войти</a></div>
  </div>

  <p class="auth-note">Регистрируясь, вы соглашаетесь с условиями использования сервиса.</p>
</div>
{% endblock %}
