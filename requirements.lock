# Точные версии зависимостей «Оборота» — тот набор, на котором зелёный CI.
#
# Зачем этот файл рядом с requirements.txt. Деплой фиксирует конкретный
# SHA кода, но на каждом релизе заново выполняет установку зависимостей.
# С диапазонами версий («fastapi>=0.110,<1») один и тот же коммит через
# несколько месяцев собирался бы уже с другим набором minor/patch —
# то есть «прод = воспроизводимая сборка» было верно только наполовину.
#
# requirements.txt остаётся как список ПРЯМЫХ зависимостей с границами
# по мажорам (его читает человек). Этот файл — полное замыкание с
# точными версиями (его читает deploy.sh). Обновлять его нужно
# осознанно: поднять версию, прогнать весь набор тестов, зафиксировать.
#
# Собрано на окружении CI: 32 пакетов.

